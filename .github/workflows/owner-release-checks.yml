name: Owner release checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: mission-control-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: release-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: ops/revenue-collector/requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install collector dependencies
        run: python -m pip install --requirement ops/revenue-collector/requirements.txt
      - name: Run the full revenue regression suite
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit --incremental false
      - name: Build the application
        run: npm run build
